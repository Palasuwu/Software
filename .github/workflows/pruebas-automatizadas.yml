name: Pruebas de integración y regresión

on:
  push:
    paths:
      - "Scrum/RedDonaciones/backend/**"
      - "Scrum/RedDonaciones/frontend/**"
      - "Scrum/RedDonaciones/db/**"
      - "Scrum/RedDonaciones/scripts/**"
      - ".github/workflows/pruebas-automatizadas.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: API + MySQL (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: donaciones
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      TEST_DB_HOST: 127.0.0.1
      TEST_DB_PORT: "3306"
      SPRINT9_MYSQL_INTEGRATION: "1"
      TEST_DB_USER: root
      TEST_DB_PASSWORD: root
      TEST_DB_NAME: donaciones
      JWT_SECRET_KEY: ci-secret-key-with-at-least-32-bytes
      ID_ORGANIZACION_PRINCIPAL: "1"

    defaults:
      run:
        working-directory: Scrum/RedDonaciones/backend

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: Scrum/RedDonaciones/backend/requirements.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-html

      - name: Preparar esquema vacío e identidad del servicio efímero
        env:
          TEST_MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: python ../scripts/prepare_ci_mysql.py

      - name: Preparar carpeta de uploads
        # routes/upload.py crea /app/uploads al importarse (ruta del contenedor Docker).
        run: sudo mkdir -p /app/uploads && sudo chown "$USER" /app/uploads

      - name: Pruebas de integración (API + MySQL)
        id: integracion
        run: >-
          pytest --mysql -m integracion tests/automatizadas -v
          --junitxml=reportes/integracion.xml
          --html=reportes/integracion.html --self-contained-html

      - name: Pruebas de regresión
        id: regresion
        if: success() || steps.integracion.conclusion == 'failure'
        run: >-
          pytest --mysql -m regresion tests/automatizadas -v
          --junitxml=reportes/regresion.xml
          --html=reportes/regresion.html --self-contained-html

      - name: Pruebas generales del backend
        run: >-
          pytest --mysql tests -v
          --ignore=tests/automatizadas
          --ignore=tests/rendimiento
          --junitxml=reportes/backend-general.xml
          --html=reportes/backend-general.html --self-contained-html

      - name: Resumen de resultados
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import glob
          import xml.etree.ElementTree as ET

          print("## Resultados de pruebas automatizadas\n")
          print("| Suite | Prueba | Resultado | Tiempo (s) |")
          print("|---|---|---|---|")
          for archivo in sorted(glob.glob("reportes/*.xml")):
              suite = archivo.split("/")[-1].removesuffix(".xml").capitalize()
              for caso in ET.parse(archivo).getroot().iter("testcase"):
                  fallo = caso.find("failure") is not None or caso.find("error") is not None
                  resultado = "❌ Falló" if fallo else ("⏭️ Omitida" if caso.find("skipped") is not None else "✅ Pasó")
                  print(f"| {suite} | `{caso.get('name')}` | {resultado} | {float(caso.get('time', 0)):.2f} |")
          EOF

      - name: Guardar reportes como artefacto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-pruebas-${{ github.run_number }}
          path: Scrum/RedDonaciones/backend/reportes/
          retention-days: 30

  frontend:
    name: Frontend (Vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: Scrum/RedDonaciones/frontend

    steps:
      - name: Obtener el código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: Scrum/RedDonaciones/frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Vitest
        run: npm run test:run
