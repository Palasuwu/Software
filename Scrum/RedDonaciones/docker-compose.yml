services:

  frontend:
    build:
      context: ./frontend
      # Vite necesita estas variables al compilar, no al ejecutar.
      # Se leen del .env de la raiz; si faltan, el boton de Google no aparece
      # y el resto del ingreso sigue funcionando.
      args:
        VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:-}
        VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:-}
        VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:-}
        VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:-}
    ports:
      - "3000:80"
    depends_on:
      - backend

  frontend-test:
      profiles: ["test"]       
      build:
        context: ./frontend
        target: builder
      working_dir: /app
      volumes:
        - ./frontend:/app
        - /app/node_modules     
      command: sh -c "npm install && npm run test:run"

  backend:
    build: ./backend
    ports:
      - "5001:5000"
    env_file:
      - .env
    environment:
      # La credencial se monta como archivo, no viaja en .env: ese archivo
      # si esta versionado en el repo.
      GOOGLE_APPLICATION_CREDENTIALS: /run/secrets/firebase.json
      # Correo saliente. Por omision va al buzon local de mailpit, que no
      # entrega nada hacia afuera: asi el flujo de recuperar contrasena se
      # puede probar sin credenciales. Para mandar correo de verdad, define
      # SMTP_HOST y companeras en tu .env y estas variables toman ese valor.
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-Liga Juvenil Donaciones <no-reply@ligajuvenil.local>}
      # Base de los enlaces que viajan por correo.
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads
      - ./backend/secrets/firebase.json:/run/secrets/firebase.json:ro

  # Buzon de correo para desarrollo: atrapa todo lo que manda el backend y lo
  # muestra en http://localhost:8025. No reenvia nada a internet, asi que es
  # seguro probar con direcciones reales.
  mailpit:
    image: axllent/mailpit:v1.32.0
    ports:
      - "8025:8025"
    restart: unless-stopped

  db:
    image: mysql:8
    container_name: mysql_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: donaciones
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  uploads_data:
