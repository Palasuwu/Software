<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 600" role="img" aria-label="Liga Juvenil Nacional">
  <title>Liga Juvenil Nacional</title>
  <style>
    .lj-shape {
      fill: #4CC1F5;
      stroke: #000000;
      stroke-width: 7;
      stroke-linejoin: miter;
    }
    .lj-text {
      font-family: "Arial Black", "Arial", sans-serif;
      font-weight: 900;
      font-size: 33px;
      fill: #4CC1F5;
      stroke: #000000;
      stroke-width: 2;
      paint-order: stroke fill;
      text-anchor: middle;
      letter-spacing: -0.5px;
    }
  </style>

  <g transform="translate(100, 30)">
    <!-- L izquierda -->
    <path class="lj-shape" d="M 0 0 L 90 0 L 90 390 L 180 390 L 180 480 L 0 480 Z" />
    <!-- L invertida derecha -->
    <path class="lj-shape" d="M 120 0 L 300 0 L 300 480 L 210 480 L 210 90 L 120 90 Z" />
  </g>

  <text x="250" y="565" class="lj-text">LIGA JUVENIL NACIONAL</text>
</svg>
