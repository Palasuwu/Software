<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 26 312 492" role="img" aria-label="Liga Juvenil Nacional">
  <title>Liga Juvenil Nacional</title>
  <!-- Solo el monograma LJ, sin el texto: se usa en marcas pequenas (navbar,
       footer) donde el wordmark del logo completo seria ilegible. El nombre
       va como texto HTML al lado. Logo completo: LogoOwner.svg -->
  <style>
    .lj-shape {
      fill: #4CC1F5;
      stroke: #000000;
      stroke-width: 7;
      stroke-linejoin: miter;
    }
  </style>

  <g transform="translate(100, 30)">
    <!-- L izquierda -->
    <path class="lj-shape" d="M 0 0 L 90 0 L 90 390 L 180 390 L 180 480 L 0 480 Z" />
    <!-- L invertida derecha -->
    <path class="lj-shape" d="M 120 0 L 300 0 L 300 480 L 210 480 L 210 90 L 120 90 Z" />
  </g>
</svg>
