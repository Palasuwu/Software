<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Liga Juvenil Nacional">
  <title>Liga Juvenil Nacional</title>
  <!-- Favicon: el monograma LJ del product owner sobre un plato Azul Profundo
       (#0B2E56). El logo solo, en Celeste, se pierde contra el blanco de la
       pestana a 16px; el plato le da masa y funciona en tema claro y oscuro. -->
  <rect width="512" height="512" rx="112" fill="#0B2E56"/>
  <g transform="translate(69.14, 54.19) scale(0.7474)">
    <g transform="translate(100, 30)" fill="#4CC1F5" stroke="#000000" stroke-width="7" stroke-linejoin="miter">
      <path d="M 0 0 L 90 0 L 90 390 L 180 390 L 180 480 L 0 480 Z" />
      <path d="M 120 0 L 300 0 L 300 480 L 210 480 L 210 90 L 120 90 Z" />
    </g>
  </g>
</svg>
